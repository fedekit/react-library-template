name: CI
on:
  push: { branches: [master] }
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20.19.5 }
      - run: npm ci
      - run: npm run build
      - run: npm test -- --ci
      - run: npm run build:storybook
      - run: |
          if [ -d docs ]; then npm run docs:build || true; fi

  release:
    needs: build-test
    permissions:
      contents: write
      pull-requests: write
    runs-on: ubuntu-latest
    steps:
      - uses: google-github-actions/release-please-action@v4
        with:
          release-type: node